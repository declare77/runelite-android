name: CI

# Hardened fork: build only. No release publishing, no signing secrets; the APK is
# debug-signed and uploaded as a workflow artifact.
on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache glslang
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # The runner image's preinstalled NDK doesn't match android-awt's pinned ndkVersion,
      # and rust-android-gradle checks for it at configure time (before AGP could
      # auto-download), failing with "NDK is not installed". Install the pinned one.
      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^\s*ndkVersion\s*=\s*"\(.*\)"/\1/p' android-awt/build.gradle.kts)
          test -n "$NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            x86_64-linux-android \
            i686-linux-android

      - name: Build release APK
        run: ./ci/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runelite-android-hardened-${{ github.run_number }}
          path: |
            android/build/outputs/apk/release/*.apk
